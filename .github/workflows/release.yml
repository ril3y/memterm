name: Release

# Tag vX.Y.Z → stamped memterm.app → DMG → EdDSA-signed → GitHub Release
# carrying the DMG and the Sparkle appcast the running apps poll
# (SUFeedURL = …/releases/latest/download/appcast.xml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.9.6"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make-app.sh stamps CFBundleVersion from the commit count
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Unit tests
        run: swift test
      # A STABLE signing identity (Apple Development cert from the founder's
      # keychain): macOS ties Accessibility grants to the app's designated
      # requirement; ad-hoc = per-binary hash = grant lost on every update.
      - name: Import signing identity
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          test -n "$SIGNING_CERT_P12" || { echo "SIGNING_CERT_P12 secret missing"; exit 1; }
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          umask 077; echo "$SIGNING_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's WWDR intermediates, so the chain builds on the runner.
          for ca in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6 DeveloperIDG2CA; do
            curl -sSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer" &&               security import "$RUNNER_TEMP/$ca.cer" -k "$KC" -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"
      - name: Build app bundle
        env:
          MEMTERM_SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: MEMTERM_VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-app.sh
      - name: Verify signature + stable requirement
        run: |
          codesign --verify --deep --strict dist/memterm.app
          codesign -d -r- dist/memterm.app 2>&1 | grep designated
          codesign -d -r- dist/memterm.app 2>&1 | grep designated | grep -q 'certificate leaf' || { echo "requirement is not certificate-bound"; exit 1; }
      # Notarization (Developer ID only): the app is notarized + stapled
      # BEFORE it goes into the DMG, then the DMG itself is notarized +
      # stapled, so both open without the "developer cannot be verified"
      # warning. Skipped — with a notice — while the signing identity is not
      # Developer ID or the App Store Connect key secrets are absent.
      - name: Notarize app (Developer ID)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          case "$SIGNING_IDENTITY" in "Developer ID Application"*) ;; *) echo "::notice::not a Developer ID identity — skipping notarization"; exit 0;; esac
          test -n "$ASC_KEY_P8" || { echo "::notice::ASC_KEY_P8 missing — skipping notarization"; exit 0; }
          umask 077; echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent dist/memterm.app "$RUNNER_TEMP/memterm.zip"
          xcrun notarytool submit "$RUNNER_TEMP/memterm.zip" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple dist/memterm.app
          spctl --assess --type execute --verbose=2 dist/memterm.app
          echo "notarized=1" >> "$GITHUB_ENV"
      - name: Build DMG
        id: dmg
        env:
          MEMTERM_SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: echo "path=$(./scripts/make-dmg.sh)" >> "$GITHUB_OUTPUT"
      - name: Notarize DMG (Developer ID)
        if: env.notarized == '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.path }}" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "${{ steps.dmg.outputs.path }}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Sparkle tools
        run: |
          curl -sSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
      - name: Sign DMG (EdDSA) + appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "SPARKLE_PRIVATE_KEY secret missing"; exit 1; }
          umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/ed.key
          SIG="$(/tmp/sparkle/bin/sign_update --ed-key-file /tmp/ed.key "${{ steps.dmg.outputs.path }}")"
          rm -f /tmp/ed.key
          echo "$SIG"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "${{ steps.dmg.outputs.path }}")"
          ./scripts/make-appcast.sh "${{ steps.dmg.outputs.path }}" "$URL" "$SIG"
          cat dist/appcast.xml
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "memterm ${GITHUB_REF_NAME#v}" --generate-notes \
            "${{ steps.dmg.outputs.path }}" dist/appcast.xml
