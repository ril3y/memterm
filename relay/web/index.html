<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>memterm remote</title>
<link rel="stylesheet" href="./xterm.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f5;
    --fg: #1a1a1a;
    --muted: #666;
    --border: #ccc;
    --accent: #2a6df4;
    --banner-bg: #b3261e;
    --banner-fg: #fff;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a;
      --fg: #eee;
      --muted: #999;
      --border: #444;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1a;
    --fg: #eee;
    --muted: #999;
    --border: #444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 16px 0 6px; }
  p { color: var(--muted); }
  [hidden] { display: none !important; }
  #banner {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--banner-bg);
    color: var(--banner-fg);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  #toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: #333;
    color: #fff;
    padding: 10px 14px;
    border-radius: 6px;
    max-width: 480px;
    margin: 0 auto;
  }
  .workspace {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .workspace.parked { opacity: 0.55; }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 4px 0;
  }
  .tab-title { color: var(--muted); min-width: 90px; }
  button {
    font: inherit;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #tree.disabled { opacity: 0.5; pointer-events: none; }
  #terminal-container {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
  }
  #view-terminal .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<h1>memterm remote</h1>
<div id="banner" hidden></div>
<div id="toast" hidden></div>

<section id="view-error" hidden>
  <p id="error-text"></p>
</section>

<section id="view-not-paired" hidden>
  <p>Not paired. Scan the pairing QR code shown by memterm's Settings ▸ Remote to connect this browser.</p>
  <p>Clearing this site's data un-pairs this browser; you'll need to scan a new code.</p>
</section>

<section id="view-pairing" hidden>
  <p>Waiting for the host to accept…</p>
</section>

<section id="view-tree" hidden>
  <div id="tree"></div>
</section>

<section id="view-terminal" hidden>
  <div class="toolbar">
    <button id="back-btn" type="button">&larr; Back</button>
    <button id="fit-btn" type="button">Fit to me</button>
  </div>
  <div id="terminal-container"></div>
</section>

<script type="module" src="./app.js"></script>
</body>
</html>
