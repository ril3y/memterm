app = 'memterm-relay'
primary_region = 'iad'
[build]
  dockerfile = 'Dockerfile'
[env]
  PORT = '8787'
  HOST = '0.0.0.0'
  # Fly terminates TLS and proxies, and overwrites `fly-client-ip` with the
  # real client address — so here, and only here, the per-IP connection cap
  # can count that header instead of the proxy's own address. Anywhere the
  # relay is reached directly the header is client-settable, and trusting
  # it would let one machine hold unlimited sockets in invented buckets
  # (security re-review N3).
  TRUST_PROXY = '1'
[http_service]
  internal_port = 8787
  force_https = true
  # EXACTLY ONE machine: the registry (hosts, clients, pairing tokens) is
  # in-memory per process. Deploy with --ha=false (release.yml does); if a
  # second machine ever appears, `fly scale count 1` — otherwise a host and
  # a phone on different machines never see each other (2026-09-21).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
